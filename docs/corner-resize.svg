<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <style>
    .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .box-old { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    .door { fill: #c7d2fe; stroke: #4338ca; stroke-width: 1.2; }
    .door-old { fill: #cbd5e1; stroke: #475569; stroke-width: 1.2; }
    .gap { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5 4; }
    .t { font-size: 12px; fill: #1e293b; }
    .ts { font-size: 10.5px; fill: #475569; }
    .ti { font-size: 14px; font-weight: 700; fill: #1e293b; }
    .dim { stroke: #0f766e; stroke-width: 1.4; fill: none; }
    .dimt { font-size: 11px; font-weight: 700; fill: #0f766e; }
    .red { stroke: #dc2626; stroke-width: 1.4; fill: none; }
    .redt { font-size: 11px; font-weight: 700; fill: #b91c1c; }
    .rule { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .wall { stroke: #0f172a; stroke-width: 5; }
  </style>

  <rect width="900" height="470" fill="#ffffff"/>

  <!-- ===================== بعد الإصلاح (يسار اللوحة) ===================== -->
  <text class="ti" x="230" y="78" text-anchor="middle">بعد — الزاوية قطعة واحدة</text>
  <text class="ts" x="230" y="96" text-anchor="middle">مربع 600 + ذراع خلفي 600 + ذراع جانبي 450</text>

  <g transform="translate(80,150) scale(0.25)">
    <rect class="wall" x="-6" y="-6" width="1212" height="6"/>
    <rect class="wall" x="-6" y="-6" width="6" height="1212"/>
    <rect class="box" x="0" y="0" width="600" height="600"/>
    <rect class="box" x="600" y="0" width="600" height="600"/>
    <rect class="box" x="0" y="600" width="450" height="600"/>
    <rect class="door" x="600" y="600" width="600" height="18"/>
    <rect class="door" x="432" y="600" width="18" height="600"/>
  </g>
  <text class="t" x="155" y="228" text-anchor="middle">مربع</text>
  <text class="ts" x="155" y="244" text-anchor="middle">600×600</text>
  <text class="t" x="312" y="228" text-anchor="middle">ذراع خلفي</text>
  <text class="ts" x="312" y="244" text-anchor="middle">600</text>
  <text class="t" x="140" y="380" text-anchor="middle">ذراع جانبي</text>
  <text class="ts" x="140" y="396" text-anchor="middle">450</text>
  <text class="ts" x="318" y="316" text-anchor="middle">جهة الباب</text>

  <!-- dimension: 1200 mm along the back wall -->
  <path class="dim" d="M230 136 H380 M230 130 V142 M380 130 V142"/>
  <text class="dimt" x="305" y="128" text-anchor="middle">1200 مم (600 + 600)</text>
  <text class="ts" x="230" y="462" text-anchor="middle">لا فراغ: حافة المربع = بداية الذراع</text>

  <!-- ===================== قبل الإصلاح (يمين اللوحة) ===================== -->
  <line class="rule" x1="470" y1="60" x2="470" y2="440"/>

  <text class="ti" x="705" y="78" text-anchor="middle">قبل — «انفصلت جهة الباب»</text>
  <text class="ts" x="705" y="96" text-anchor="middle">الذراع كُبِّر فانزلق، والمربع والذراع الجانبي لم يتحركا</text>

  <g transform="translate(560,150) scale(0.25)">
    <rect class="wall" x="-6" y="-6" width="1182" height="6"/>
    <rect class="wall" x="-6" y="-6" width="6" height="1212"/>
    <rect class="box-old" x="0" y="0" width="600" height="600"/>
    <rect class="box-old" x="720" y="0" width="450" height="600"/>
    <rect class="box-old" x="0" y="600" width="450" height="600"/>
    <rect class="gap" x="600" y="0" width="120" height="600"/>
    <rect class="door-old" x="720" y="600" width="450" height="18"/>
    <rect class="door-old" x="432" y="600" width="18" height="600"/>
  </g>
  <text class="t" x="635" y="228" text-anchor="middle">مربع</text>
  <text class="ts" x="635" y="244" text-anchor="middle">600×600</text>
  <text class="t" x="815" y="228" text-anchor="middle">ذراع</text>
  <text class="ts" x="815" y="244" text-anchor="middle">450</text>
  <text class="t" x="616" y="380" text-anchor="middle">ذراع جانبي</text>
  <text class="ts" x="616" y="396" text-anchor="middle">450</text>
  <text class="ts" x="812" y="316" text-anchor="middle">جهة الباب</text>

  <!-- the gap, called out -->
  <path class="red" d="M710 258 H740 M710 252 V264 M740 252 V264"/>
  <path class="red" d="M725 300 V338"/>
  <text class="redt" x="725" y="352" text-anchor="middle">فراغ 120 مم</text>
  <text class="redt" x="725" y="130" text-anchor="middle">لا شيء يسدّ هذا الفراغ</text>
  <path class="red" d="M725 136 V150"/>

  <!-- ===================== الخلاصة ===================== -->
  <rect x="24" y="430" width="852" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="ts" x="450" y="447" text-anchor="middle">
    الثلاثة يُعاد حسابهم من الأرقام الثلاثة (المربع · الذراع الخلفي · الذراع الجانبي) بنفس دالة البناء، وتُكتب بخزنة واحدة — مقاسات بالمليمتر
  </text>
</svg>
