<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Inter, 'Segoe UI', Tahoma, Arial, sans-serif" direction="rtl">
  <!-- The ONE bottom of an L corner: three boxes (square 600 + two 450 arms, 600 deep, 18 mm board) stand on a single board
       cut in an L: 1014 x 1014 outside, legs 600 deep, the inner 432 x 432 taken out as an offcut.
       Plan view, scale 0.36 px/mm, the corner at (140, 120). -->
  <rect width="1000" height="760" fill="#75808E"/>
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#F5F7FA">قاعدة الزاوية L — قطعة واحدة مقصوصة على شكل L</text>
  <text x="500" y="62" text-anchor="middle" font-size="12" fill="#E2E7EC">الخزانة: مربع 600 + ذراعان 450 · عمق 600 · لوح 18 مم · القطعة: 1014 × 1014 خارجياً بعرض رجل 600</text>

  <!-- ============ left: the three boxes ============ -->
  <g>
    <text x="140" y="104" font-size="12" font-weight="700" fill="#F5F7FA">الصناديق الثلاثة</text>

    <!-- outer outline of the group: 1050 x 1050 = 378 px -->
    <rect x="140" y="120" width="378" height="378" fill="none" stroke="#9AA5AF" stroke-width="1.2" stroke-dasharray="6 5"/>

    <!-- square 600x600 -->
    <rect x="140" y="120" width="216" height="216" fill="#D9CFC2" fill-opacity="0.35" stroke="#B9AC9C" stroke-width="1.4"/>
    <!-- arm A: 450 along the back wall -->
    <rect x="356" y="120" width="162" height="216" fill="#D9CFC2" fill-opacity="0.2" stroke="#B9AC9C" stroke-width="1.4"/>
    <!-- arm B: 450 along the side wall -->
    <rect x="140" y="336" width="216" height="162" fill="#D9CFC2" fill-opacity="0.2" stroke="#B9AC9C" stroke-width="1.4"/>

    <!-- the three decks, one colour: they are the one board -->
    <g fill="#C49B78" fill-opacity="0.9" stroke="#8A6448" stroke-width="1">
      <rect x="146.5" y="120" width="209.5" height="216"/>
      <rect x="356" y="120" width="155.5" height="216"/>
      <rect x="146.5" y="336" width="209.5" height="155.5"/>
    </g>
    <!-- outer side boards (18 mm = 6.5 px) -->
    <g fill="#B9AC9C">
      <rect x="140" y="120" width="6.5" height="216"/>
      <rect x="140" y="120" width="216" height="6.5"/>
      <rect x="511.5" y="120" width="6.5" height="216"/>
      <rect x="140" y="491.5" width="216" height="6.5"/>
    </g>

    <text x="243" y="232" text-anchor="middle" font-size="10" font-weight="700" fill="#3E2B24">مربع 600</text>
    <text x="434" y="232" text-anchor="middle" font-size="10" font-weight="700" fill="#3E2B24">ذراع 450</text>
    <text x="250" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#3E2B24">ذراع 450</text>
    <text x="140" y="522" font-size="10" fill="#E2E7EC">القطع الثلاث: 3 ألواح قاع منفصلة — خطّان في المنتصف</text>
  </g>

  <!-- ============ right: the same bottom, one piece ============ -->
  <g>
    <text x="560" y="104" font-size="12" font-weight="700" fill="#F5F7FA">قاعدة واحدة</text>

    <!-- the L piece: 1014 x 1014 = 365 px, corner at (560,120) -->
    <path d="M 560 120 H 925 V 336 H 776 V 485 H 560 Z"
          fill="#C49B78" stroke="#3E2B24" stroke-width="2"/>
    <!-- the offcut square, drawn faintly -->
    <rect x="776" y="336" width="149" height="149" fill="none" stroke="#8A6448" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="850" y="416" text-anchor="middle" font-size="9" fill="#F3E9DF">قصاصة 432×432</text>

    <!-- legs -->
    <text x="740" y="300" text-anchor="middle" font-size="10" font-weight="700" fill="#3E2B24">600</text>
    <text x="668" y="410" text-anchor="middle" font-size="10" font-weight="700" fill="#3E2B24">600</text>

    <!-- 1014 both ways -->
    <line x1="560" y1="104" x2="925" y2="104" stroke="#7CD9A5" stroke-width="1.4"/>
    <line x1="560" y1="98" x2="560" y2="110" stroke="#7CD9A5" stroke-width="1.4"/>
    <line x1="925" y1="98" x2="925" y2="110" stroke="#7CD9A5" stroke-width="1.4"/>
    <text x="742" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#7CD9A5">1014 مم</text>

    <line x1="542" y1="120" x2="542" y2="485" stroke="#7CD9A5" stroke-width="1.4"/>
    <line x1="536" y1="120" x2="548" y2="120" stroke="#7CD9A5" stroke-width="1.4"/>
    <line x1="536" y1="485" x2="548" y2="485" stroke="#7CD9A5" stroke-width="1.4"/>
    <text x="534" y="305" text-anchor="middle" font-size="10" font-weight="700" fill="#7CD9A5" transform="rotate(-90 534 305)">1014 مم</text>

    <!-- the band runs along the two fronts only -->
    <line x1="560" y1="485" x2="776" y2="485" stroke="#FFD166" stroke-width="3"/>
    <line x1="925" y1="120" x2="925" y2="336" stroke="#FFD166" stroke-width="3"/>
    <text x="700" y="508" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFD166">حافة على الواجهتين فقط: 432 + 432</text>
  </g>

  <!-- ============ the sheet ============ -->
  <g transform="translate(60,540)">
    <rect x="0" y="0" width="880" height="190" rx="14" fill="#F7F5F2" opacity="0.97"/>
    <text x="856" y="30" text-anchor="end" font-size="13" font-weight="700" fill="#3E2B24">ورقة القص</text>
    <text x="856" y="56" text-anchor="end" font-size="11.5" fill="#4A423A">Corner L Bottom Deck (one piece: L 1014×1014 outside, legs 600, corner offcut 432×432) — كمّية 1</text>
    <text x="856" y="80" text-anchor="end" font-size="11.5" fill="#4A423A">صفّ واحد في قائمة القص، وفي BOM، وفي المخزون — لا ثلاثة ألواح ولا لوحان فوق بعضهما في الزاوية</text>
    <line x1="22" y1="98" x2="856" y2="98" stroke="#CFC4B6" stroke-width="1"/>
    <text x="856" y="122" text-anchor="end" font-size="11" fill="#4A423A">المساحة 0.868 م² = نفس مساحة الألواح الثلاث القديمة، لكن قطعة واحدة: لا فاصل في الزاوية ولا سماكة مزدوجة</text>
    <text x="856" y="146" text-anchor="end" font-size="11" fill="#4A423A">المربع الداخلي 432×432 يبقى قصاصة قابلة للاستعمال — ولهذا لا يزيد سعر الزاوية</text>
    <text x="856" y="172" text-anchor="end" font-size="11" font-weight="700" fill="#2E6B4A">وإن اختلفت أعماق الصناديق أو سُمك ألواحها: يعود كل صندوق إلى لوح قاعه وحده (لا قطعة خاطئة)</text>
  </g>
</svg>
