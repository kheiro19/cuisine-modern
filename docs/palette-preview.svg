<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Inter, 'Segoe UI', Tahoma, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F242B" flood-opacity="0.35"/>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1F242B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- the cold slate room -->
  <rect width="960" height="620" fill="#75808E"/>
  <g opacity="0.5" stroke="#96A0AD" stroke-width="1">
    <path d="M0 520 H960"/>
    <path d="M0 545 H960"/>
    <path d="M0 570 H960"/>
    <path d="M0 595 H960"/>
  </g>

  <!-- the cabinet: cashmere carcase, walnut fronts -->
  <g filter="url(#soft)" transform="translate(72,96)">
    <!-- carcase -->
    <rect x="0" y="0" width="420" height="420" rx="4" fill="#D9CFC2"/>
    <!-- internal shadow line at the top -->
    <rect x="0" y="0" width="420" height="10" fill="#CFC4B6"/>
    <!-- two walnut doors -->
    <rect x="8" y="12" width="200" height="380" rx="3" fill="#5C4033"/>
    <rect x="212" y="12" width="200" height="380" rx="3" fill="#5C4033"/>
    <!-- door grain -->
    <g stroke="#4B332A" stroke-width="1" opacity="0.35">
      <path d="M40 20 C 52 140, 36 280, 48 384"/>
      <path d="M96 20 C 86 150, 104 270, 92 384"/>
      <path d="M152 20 C 164 140, 148 280, 160 384"/>
      <path d="M236 20 C 248 140, 232 280, 244 384"/>
      <path d="M292 20 C 282 150, 300 270, 288 384"/>
      <path d="M348 20 C 360 140, 344 280, 356 384"/>
    </g>
    <!-- gap between the doors -->
    <rect x="208" y="12" width="4" height="380" fill="#3E2B24" opacity="0.85"/>
    <!-- plinth -->
    <rect x="6" y="392" width="408" height="28" rx="2" fill="#C9BEB0"/>
    <!-- handles -->
    <rect x="176" y="196" width="6" height="46" rx="3" fill="#3A3634"/>
    <rect x="238" y="196" width="6" height="46" rx="3" fill="#3A3634"/>
  </g>

  <!-- a wall unit above, to show the same two finishes at another scale -->
  <g filter="url(#tiny)" transform="translate(530,60)">
    <rect x="0" y="0" width="300" height="150" rx="4" fill="#D9CFC2"/>
    <rect x="8" y="10" width="138" height="114" rx="3" fill="#5C4033"/>
    <rect x="154" y="10" width="138" height="114" rx="3" fill="#5C4033"/>
    <rect x="146" y="10" width="4" height="114" fill="#3E2B24" opacity="0.85"/>
    <rect x="0" y="130" width="300" height="20" fill="#C9BEB0"/>
  </g>

  <!-- the three swatches -->
  <g transform="translate(530,250)">
    <rect x="0" y="0" width="360" height="292" rx="14" fill="#F7F5F2" opacity="0.97" filter="url(#tiny)"/>

    <!-- front -->
    <rect x="18" y="18" width="324" height="76" rx="9" fill="#5C4033"/>
    <text x="330" y="44" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#F3E9DF">بني الجوز المطفي</text>
    <text x="330" y="66" text-anchor="end" font-size="11" fill="#D9CBBE" letter-spacing="0.5">Matte Walnut · #5C4033</text>

    <!-- carcase -->
    <rect x="18" y="106" width="324" height="76" rx="9" fill="#D9CFC2"/>
    <text x="330" y="132" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#4A423A">بيج كشمير مطفي فائق</text>
    <text x="330" y="154" text-anchor="end" font-size="11" fill="#6E6459" letter-spacing="0.5">Super Matte Cashmere · #D9CFC2</text>

    <!-- background -->
    <rect x="18" y="194" width="324" height="76" rx="9" fill="#75808E"/>
    <text x="330" y="220" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#F4F7FA">رمادي فحم بارد</text>
    <text x="330" y="242" text-anchor="end" font-size="11" fill="#E2E7EC" letter-spacing="0.5">Slate Cool Gray · #75808E</text>
  </g>

  <!-- caption -->
  <text x="72" y="566" font-size="13" fill="#EDF1F4" opacity="0.95">اللوحة الافتراضية: ألوان تُرسم على الخزائن في المشهد ثلاثي الأبعاد</text>
  <text x="72" y="588" font-size="11" fill="#DDE3E9" opacity="0.8">src/math/palette.ts — الثلاثة في مكان واحد. صورة تمثيلية للون، لا للتسعير.</text>
</svg>
