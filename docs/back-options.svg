<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="Inter, 'Segoe UI', Tahoma, Arial, sans-serif" direction="rtl">
  <!-- The rear of one 600 x 870 x 600 base unit, drawn three times: the three ways the back can be closed.
       Scale 0.32 px/mm. The draw is the REAR view: what the fitter sees when the cabinet is turned around. -->
  <rect width="980" height="660" fill="#75808E"/>

  <text x="490" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#F5F7FA">خلفية الخزانة — ثلاثة اختيارات تحت يدك</text>
  <text x="490" y="60" text-anchor="middle" font-size="12" fill="#E2E7EC">الخزانة نفسها: 600 × 870 × 600 مم · لوح الهيكل 18 مم · لوح HDF 3 مم — الفرق في الظهر فقط</text>

  <!-- ============================ 1: HDF ============================ -->
  <g>
    <text x="156" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F7FA">① HDF 3 مم</text>
    <text x="156" y="116" text-anchor="middle" font-size="10.5" fill="#E2E7EC">الافتراضي — كما كانت كل خزانة</text>

    <rect x="60" y="132" width="192" height="278" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1.5"/>
    <!-- the sheet is one piece: a light texture of horizontal lines -->
    <g stroke="#B9BEC5" stroke-width="0.8" opacity="0.7">
      <line x1="60" y1="160" x2="252" y2="160"/><line x1="60" y1="200" x2="252" y2="200"/>
      <line x1="60" y1="240" x2="252" y2="240"/><line x1="60" y1="280" x2="252" y2="280"/>
      <line x1="60" y1="320" x2="252" y2="320"/><line x1="60" y1="360" x2="252" y2="360"/>
      <line x1="60" y1="400" x2="252" y2="400"/>
    </g>
    <!-- screws round the perimeter -->
    <g fill="#4B5563">
      <circle cx="64" cy="140" r="2"/><circle cx="64" cy="190" r="2"/><circle cx="64" cy="240" r="2"/><circle cx="64" cy="290" r="2"/><circle cx="64" cy="340" r="2"/><circle cx="64" cy="390" r="2"/>
      <circle cx="248" cy="140" r="2"/><circle cx="248" cy="190" r="2"/><circle cx="248" cy="240" r="2"/><circle cx="248" cy="290" r="2"/><circle cx="248" cy="340" r="2"/><circle cx="248" cy="390" r="2"/>
      <circle cx="100" cy="136" r="2"/><circle cx="150" cy="136" r="2"/><circle cx="200" cy="136" r="2"/>
      <circle cx="100" cy="406" r="2"/><circle cx="150" cy="406" r="2"/><circle cx="200" cy="406" r="2"/>
    </g>

    <text x="156" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#F5F7FA">لوح واحد 600 × 870 × 3</text>
    <text x="156" y="456" text-anchor="middle" font-size="9.5" fill="#DDE3E9">ملصوق على الوجه الخلفي · يُقصّ من لوح HDF</text>
    <text x="156" y="474" text-anchor="middle" font-size="9.5" fill="#DDE3E9">أخفّ وأرخص · لا شيء يضيع من العمق الداخلي</text>
  </g>

  <!-- ============================ 2: RAILS ============================ -->
  <g>
    <text x="490" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F7FA">② عارضتان من لوح الهيكل</text>
    <text x="490" y="116" text-anchor="middle" font-size="10.5" fill="#E2E7EC">واحدة على القاع وأخرى تحت السقف</text>

    <!-- the carcase seen from the rear: sides, deck and top -->
    <rect x="394" y="132" width="192" height="278" fill="none" stroke="#B9AC9C" stroke-width="1"/>
    <rect x="394" y="132" width="5.76" height="278" fill="#D9CFC2"/>
    <rect x="580.24" y="132" width="5.76" height="278" fill="#D9CFC2"/>
    <rect x="394" y="132" width="192" height="5.76" fill="#D9CFC2"/>
    <rect x="394" y="404.24" width="192" height="5.76" fill="#D9CFC2"/>
    <!-- open inside: you look straight into the cabinet -->
    <g stroke="#9AA5AF" stroke-width="1" opacity="0.55">
      <line x1="410" y1="190" x2="570" y2="190"/><line x1="410" y1="240" x2="570" y2="240"/>
      <line x1="410" y1="290" x2="570" y2="290"/><line x1="410" y1="340" x2="570" y2="340"/>
    </g>
    <!-- the two rails: 100 mm deep each, from the deck up and from under the top down -->
    <rect x="399.76" y="137.76" width="180.48" height="32" fill="#C49B78" stroke="#3E2B24" stroke-width="1.1"/>
    <rect x="399.76" y="372.24" width="180.48" height="32" fill="#C49B78" stroke="#3E2B24" stroke-width="1.1"/>
    <g fill="#4B5563">
      <circle cx="420" cy="154" r="1.8"/><circle cx="470" cy="154" r="1.8"/><circle cx="520" cy="154" r="1.8"/><circle cx="560" cy="154" r="1.8"/>
      <circle cx="420" cy="388" r="1.8"/><circle cx="470" cy="388" r="1.8"/><circle cx="520" cy="388" r="1.8"/><circle cx="560" cy="388" r="1.8"/>
    </g>

    <!-- the 100 mm rail, dimensioned -->
    <line x1="588" y1="137.76" x2="588" y2="169.76" stroke="#7CD9A5" stroke-width="1.4"/>
    <line x1="584" y1="137.76" x2="592" y2="137.76" stroke="#7CD9A5" stroke-width="1.4"/>
    <line x1="584" y1="169.76" x2="592" y2="169.76" stroke="#7CD9A5" stroke-width="1.4"/>
    <text x="596" y="157" font-size="9" font-weight="700" fill="#7CD9A5">100</text>

    <text x="490" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#F5F7FA">عارضتان 564 × 100 × 18</text>
    <text x="490" y="456" text-anchor="middle" font-size="9.5" fill="#DDE3E9">تُقصّ من لوح الهيكل نفسه · بلا ظهر بينهما</text>
    <text x="490" y="474" text-anchor="middle" font-size="9.5" fill="#DDE3E9">أرخص وأنعم للتهوية · لكن الغبار والسلك يظهران</text>
  </g>

  <!-- ============================ 3: PANEL ============================ -->
  <g>
    <text x="824" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F7FA">③ لوح مثل باقي قطع الهيكل</text>
    <text x="824" y="116" text-anchor="middle" font-size="10.5" fill="#E2E7EC">18 مم داخل الظهر</text>

    <rect x="728" y="132" width="192" height="278" fill="#D9CFC2" stroke="#B9AC9C" stroke-width="2"/>
    <!-- the panel: between the sides, on the deck, under the top -->
    <rect x="733.76" y="137.76" width="180.48" height="266.48" fill="#C49B78" stroke="#3E2B24" stroke-width="1.2"/>
    <line x1="740" y1="137.76" x2="740" y2="404.24" stroke="#E8D9CE" stroke-width="1" opacity="0.5"/>
    <line x1="908" y1="137.76" x2="908" y2="404.24" stroke="#E8D9CE" stroke-width="1" opacity="0.5"/>
    <!-- the 18 mm frame of the carcase around it -->
    <g fill="#D9CFC2" stroke="#B9AC9C" stroke-width="0.6">
      <rect x="728" y="132" width="5.76" height="278"/><rect x="914.24" y="132" width="5.76" height="278"/>
      <rect x="728" y="132" width="192" height="5.76"/><rect x="728" y="404.24" width="192" height="5.76"/>
    </g>
    <text x="824" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#F3E9DF">لوح 564 × 834 × 18</text>

    <text x="824" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#F5F7FA">من خامة الهيكل وبنفس سُمكه</text>
    <text x="824" y="456" text-anchor="middle" font-size="9.5" fill="#DDE3E9">أقوى ظهر · يأخذ 18 مم من العمق الداخلي</text>
    <text x="824" y="474" text-anchor="middle" font-size="9.5" fill="#DDE3E9">فتقصر الأرفف والحواجز ولوحات المفصلات وحدها</text>
  </g>

  <!-- ============================ legend ============================ -->
  <g transform="translate(60,510)">
    <rect x="0" y="0" width="860" height="126" rx="14" fill="#F7F5F2" opacity="0.97"/>
    <text x="838" y="26" text-anchor="end" font-size="12" font-weight="700" fill="#3E2B24">التحكم في اللوحة</text>
    <text x="838" y="50" text-anchor="end" font-size="11" fill="#4A423A">🧱 خلفية الخزانة: [ HDF 3 مم ] [ عارضتان (أعلى وأسفل) ] [ لوح مثل الهيكل ] — تحت كل خزانة وحدها</text>
    <text x="838" y="72" text-anchor="end" font-size="11" fill="#4A423A">عارضتان: عرض العارضة تحت يدك من 50 إلى 200 مم (الافتراضي 100) · وإن ضاق الجزء المغلق تُقصّ واحدة في الوسط</text>
    <text x="838" y="94" text-anchor="end" font-size="11" fill="#4A423A">⟲ تعميم على كل الخزائن: نفس الخلفية لكل المطبخ بضغطة واحدة</text>
    <text x="838" y="116" text-anchor="end" font-size="11" font-weight="700" fill="#2E6B4A">القص والتسعير والـ3D و BOM تتبع الاختيار نفسه — والذراع 450 في الزاوية لا تتغيّر</text>
  </g>
</svg>
